<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hollow Knight - Vengefly King Arena (Greenpath)</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            margin: 0;
            overflow: hidden;
            background: #0b1414;
            font-family: 'Cinzel', 'Segoe UI', serif;
            color: #d8eee0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        /* Navigation Header */
        #top-nav {
            position: absolute;
            top: 20px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .nav-btn {
            background: rgba(11, 20, 20, 0.85);
            border: 1px solid rgba(80, 200, 140, 0.35);
            padding: 10px 18px;
            border-radius: 8px;
            color: #b8e6ca;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .nav-btn:hover {
            background: rgba(30, 60, 48, 0.9);
            border-color: #50c88c;
            color: #fff;
            transform: translateY(-2px);
        }
        .nav-btn.active {
            background: #1b4d37;
            border-color: #50c88c;
            color: #a8ffd2;
            box-shadow: 0 0 16px rgba(80, 200, 140, 0.4);
        }

        #arena-card {
            position: absolute;
            top: 76px;
            left: 24px;
            background: rgba(11, 20, 20, 0.88);
            border: 1px solid rgba(80, 200, 140, 0.35);
            padding: 16px 22px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 420px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        #arena-card h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 4px 0;
            color: #a8ffd2;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #arena-card .badge {
            font-size: 10px;
            background: #1e6d4c;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        #arena-card p {
            font-size: 12px;
            color: #8dbda0;
            margin: 0;
            line-height: 1.45;
        }

        #nav-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 20, 20, 0.82);
            border: 1px solid rgba(80, 200, 140, 0.3);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 12px;
            color: #a8d5be;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="top-nav">
        <a href="env_vengefly_king.html" class="nav-btn active">🌿 Vengefly King (Greenpath)</a>
        <a href="env_pilflip.html" class="nav-btn">💧 Pilflip (Royal Waterways)</a>
    </div>

    <div id="arena-card">
        <h1>Vengefly King Arena <span class="badge">Greenpath Lore</span></h1>
        <p>
            Tebing terjal Greenpath tempat sarang Vengefly King. Jurang batu berlapis lumut asam, sulur pakis berayun, dan sarang kepompong gantung.
        </p>
    </div>

    <div id="nav-hint">
        🖱️ Klik &amp; geser mouse untuk rotasi 3D &nbsp;|&nbsp; ⚙️ Scroll untuk zoom
    </div>

    <canvas id="glcanvas"></canvas>
    <script src="libs.js"></script>
    <script src="env_vengefly_king.js"></script>
</body>
</html>
